# Formatting, lints, type checks and tests, on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # tradu uses Windows APIs, so it only builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned, so a new Rust release's new clippy lints don't fail CI out of the blue.
      # Bump it on purpose and fix what the new clippy reports.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
