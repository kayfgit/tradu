<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tradu</title>
  <link rel="stylesheet" href="style.css">
  <script src="langs.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main id="history" aria-label="History"></main>

  <section id="live">
    <span id="prompt" class="gutter"></span>
    <textarea id="input" dir="auto" rows="1" spellcheck="false" aria-label="Text to translate"></textarea>
    <span id="mark" class="gutter" hidden>⏎</span>
    <textarea id="output" dir="auto" rows="1" readonly tabindex="-1" aria-label="Translation"></textarea>
    <div id="meta"></div>
  </section>

  <div id="picker" hidden>
    <input id="query" autocomplete="off" spellcheck="false">
    <ol id="matches"></ol>
  </div>

  <footer data-tauri-drag-region>
    <button id="pair" tabindex="-1" title="Languages (Ctrl+L)"></button>
    <span id="info" role="status" data-tauri-drag-region></span>
    <span id="hints" data-tauri-drag-region></span>
  </footer>
</body>
</html>
